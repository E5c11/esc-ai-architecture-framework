# Project Profile Schema
# Every project consuming this framework defines one project-profile.yaml
# in its context/ directory.
#
# The profile is the retrieval key — it determines which framework
# layers and documents are loaded for a given task.
#
# Example profile (context/project-profile.yaml in a consuming project):
#
#   project: ampm
#   platform: mobile
#   language: kotlin
#   architecture: pragmatic-clean
#   frameworks:
#     di: koin
#     ui: compose
#     network: ktor
#     database: room
#     cloud: firebase
#   build:
#     system: gradle
#     convention-plugins: true

schema:
  version: "1.2"
  type: project-profile
  changelog:
    "1.2": >
      Added `frameworks.analytics` — a required-once-declared tracking
      philosophy (comprehensive / deliberate / funnel-critical-only / none),
      not a library choice, so unlike every other `frameworks.*` key its
      value alone doesn't imply a platform (see PROFILE_DOC_MAP's comment in
      `tools/lookup.py`). Frontend-only (mobile/web) — a backend/library
      project omits it. See `patterns/analytics-events.md`.
    "1.1": >
      Added `frameworks.forms` — a web-app project's form state/validation
      library (react-hook-form, formik) is a framework choice PROFILE_DOC_MAP
      needs to select PLAT-WEB-FORMS from, the same way `frameworks.network`
      already selects PLAT-MOB-HTTP/PLAT-WEB-HTTP. See `platforms/web/forms.md`.

fields:

  project:
    type: string
    required: true
    description: Project identifier. Lowercase, hyphen-separated.

  platform:
    type: enum
    required: true
    values: [mobile, backend, web]
    description: >
      Primary platform. Determines which platforms/{name}/ layer is loaded.

  targets:
    type: array
    required: false
    values: [android, ios, jvm, js, wasmJs]
    description: Concrete KMP/runtime targets used to select target-specific guides.

  language:
    type: string
    required: true
    description: >
      Primary implementation language.
      Examples: kotlin, typescript, java

  architecture:
    type: enum
    required: true
    values:
      - pragmatic-clean   # Clean Architecture layers without full abstraction overhead
      - backend-service   # Controller → Service → DataSource
      - web-spa           # Client-side SPA, React + TypeScript
      - web-content       # SSG/ISR-first marketing/content sites, Next.js
      - web-app           # Server-capable interactive apps, Next.js
      - vertical-slice    # Feature-first, no shared layers
      - hexagonal         # Ports and adapters
    description: >
      Architectural style. Determines which architectures/{name}/ layer is loaded
      and which patterns are required.

  frameworks:
    type: object
    required: false
    description: >
      Technology choices that select platform-specific modules.
      Omit any key that does not apply to this project.
    properties:
      di:
        type: string
        description: "Dependency injection framework. Examples: koin, spring, none"
      ui:
        type: string
        description: "UI framework. Examples: compose, react, next, none"
      network:
        type: string
        description: "Network layer. Examples: ktor, retrofit, axios, spring-web"
      database:
        type: string
        description: "Local database. Examples: room, jpa, firebase, none"
      cloud:
        type: string
        description: "Cloud/backend provider. Examples: firebase, gcp, aws, none"
      storage:
        type: string
        description: "Preferences storage. Examples: datastore, none"
      secure-storage:
        type: string
        description: "Credential storage. Examples: keychain, keystore, platform"
      auth:
        type: string
        description: "Authentication integration. Examples: oauth, firebase, none"
      billing:
        type: string
        description: "Billing provider. Examples: storekit, play-billing, none"
      notifications:
        type: string
        description: "Notification strategy. Examples: multiplatform, workmanager, none"
      forms:
        type: string
        description: "Form state/validation library. Examples: react-hook-form, formik, none"
      analytics:
        type: string
        description: >
          Tracking philosophy, not a library — mobile/web only, omit for backend/library
          projects. Values: comprehensive, deliberate, funnel-critical-only, none.
          See patterns/analytics-events.md.

  build:
    type: object
    required: false
    description: Build system configuration.
    properties:
      system:
        type: string
        description: "Build tool. Examples: gradle, maven, npm"
      convention-plugins:
        type: boolean
        description: "Whether this project uses Gradle convention plugins."
