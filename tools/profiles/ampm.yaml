# Sample project profile — AMPM
# Reference: ampm-ai-framework/ for AMPM-specific docs (AMPM-* IDs).

project: ampm
platform: mobile
targets: [android, ios, wasmJs]
language: kotlin
architecture: pragmatic-clean
frameworks:
  di: koin
  ui: compose
  network: ktor
  database: room
  cloud: firebase
  storage: datastore
  secure-storage: keychain
  auth: oauth
  billing: storekit
  notifications: multiplatform
build:
  system: gradle
  convention-plugins: true
