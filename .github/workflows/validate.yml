name: Validate Framework

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Document validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run document validator
        run: python tools/validate.py

  index:
    name: Generate index
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate document index
        run: python tools/index.py --out ./dist

      - name: Upload index artifact
        uses: actions/upload-artifact@v4
        with:
          name: framework-index
          path: dist/
          retention-days: 30
